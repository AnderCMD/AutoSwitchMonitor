name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: AutoSwitchMonitor.exe
            artifact: AutoSwitchMonitor-windows-amd64
            ldflags: -H=windowsgui
          - os: macos-latest
            binary: AutoSwitchMonitor
            artifact: AutoSwitchMonitor-macos-arm64
            ldflags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build
        run: go build -ldflags="${{ matrix.ldflags }}" -o ${{ matrix.binary }} ./cmd/autoswitchmonitor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  # Runs on every push to main (i.e. every merged PR from dev) and on
  # manually pushed "v*" tags. Collects the binaries built by the "build"
  # job for windows and macOS and publishes a GitHub Release with both
  # attached. On main the version is computed automatically: the latest
  # v* tag gets a patch bump, or a minor/major bump if the head commit
  # message contains "#minor" / "#major".
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          msg=$(git log -1 --format=%B)
          if [[ "$msg" == *"#major"* ]]; then major=$((major+1)); minor=0; patch=0
          elif [[ "$msg" == *"#minor"* ]]; then minor=$((minor+1)); patch=0
          else patch=$((patch+1)); fi
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*/*
          generate_release_notes: true
