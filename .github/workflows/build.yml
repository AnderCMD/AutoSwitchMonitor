name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: AutoSwitchMonitor.exe
            artifact: AutoSwitchMonitor-windows-amd64
            ldflags: -H=windowsgui
          - os: macos-latest
            binary: AutoSwitchMonitor
            artifact: AutoSwitchMonitor-macos-arm64
            ldflags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # cgo (systray, hotkey, webview) necesita un compilador C real; el
      # runner de Windows no trae mingw/gcc por defecto.
      - name: Install mingw (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v2

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags="${{ matrix.ldflags }}" -o ${{ matrix.binary }} ./cmd/autoswitchmonitor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
