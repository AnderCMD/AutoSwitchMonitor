name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: AutoSwitchMonitor.exe
            artifact: AutoSwitchMonitor-windows-amd64
            ldflags: -H=windowsgui
          - os: macos-latest
            binary: AutoSwitchMonitor
            artifact: AutoSwitchMonitor-macos-arm64
            ldflags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build
        run: go build -ldflags="${{ matrix.ldflags }}" -o ${{ matrix.binary }} ./cmd/autoswitchmonitor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  # Solo corre cuando el push es un tag "v*" (ej. v1.0.0). Junta los
  # binarios que ya compiló el job "build" para windows y macOS y publica
  # un Release en GitHub con ambos adjuntos — no hay que subir nada a mano.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
          generate_release_notes: true
