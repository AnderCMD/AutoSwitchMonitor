<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ringGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#eaf2fd"/>
      <stop offset="28%" stop-color="#bcd8f7"/>
      <stop offset="60%" stop-color="#7fabe0"/>
      <stop offset="100%" stop-color="#436fa8"/>
    </linearGradient>
    <linearGradient id="screenStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f5fa8"/>
      <stop offset="100%" stop-color="#1a3f7d"/>
    </linearGradient>
    <linearGradient id="onGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fe89a"/>
      <stop offset="45%" stop-color="#33ba5b"/>
      <stop offset="100%" stop-color="#1a8f45"/>
    </linearGradient>
    <radialGradient id="knobGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce8e0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5CF285" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#33c95e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#33c95e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="bigBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1f3a" flood-opacity="0.35"/>
    </filter>
    <clipPath id="ringClip">
      <path fill-rule="evenodd" d="M256,16 A240,240 0 1,0 256.1,16 Z M256,74 A182,182 0 1,1 255.9,74 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#dropShadow)">
    <path fill-rule="evenodd" fill="url(#ringGrad)"
      d="M256,16 A240,240 0 1,0 256.1,16 Z M256,74 A182,182 0 1,1 255.9,74 Z"/>

    <ellipse cx="230" cy="120" rx="190" ry="80" fill="#ffffff" opacity="0.45" clip-path="url(#ringClip)" filter="url(#softBlur)"/>
    <ellipse cx="290" cy="400" rx="190" ry="70" fill="#0f2c52" opacity="0.28" clip-path="url(#ringClip)" filter="url(#softBlur)"/>

    <circle cx="256" cy="256" r="182" fill="none" stroke="#0f2c52" stroke-opacity="0.3" stroke-width="3"/>
  </g>

  <g>
    <ellipse cx="256" cy="248" rx="118" ry="60" fill="url(#glow)" filter="url(#bigBlur)"/>

    <rect x="146" y="176" width="220" height="146" rx="24" ry="24"
      fill="none" stroke="url(#screenStroke)" stroke-width="20" stroke-linejoin="round"/>

    <rect x="243" y="320" width="26" height="28" fill="url(#screenStroke)"/>
    <path d="M204,362 L308,362 L292,346 L220,346 Z" fill="url(#screenStroke)"/>

    <rect x="178" y="216" width="156" height="64" rx="32" ry="32" fill="url(#onGrad)"/>
    <rect x="178" y="216" width="156" height="30" rx="15" fill="#ffffff" opacity="0.18"/>

    <text x="210" y="258" font-family="Arial, Helvetica, sans-serif" font-weight="700"
      font-size="34" fill="#ffffff" letter-spacing="1">ON</text>

    <circle cx="302" cy="248" r="25" fill="url(#knobGrad)"/>
    <circle cx="302" cy="248" r="25" fill="none" stroke="#1a8f45" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
